[versions]
lombok = "1.18.48"
avaje-jsonb = "3.16"
slf4j = "2.0.16"
snakeyaml = "2.3"
undertow = "2.4.3.Final"
forgery-jodist = "0.0.1"
jimmer = "0.12.3"
jackson = "2.18.2"
hikaricp = "6.3.3"
swagger = "2.2.54"
shadow = "9.4.0"
foojay = "1.0.0"

[libraries]
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
avaje-jsonb = { module = "io.avaje:avaje-jsonb", version.ref = "avaje-jsonb" }
avaje-jsonb-generator = { module = "io.avaje:avaje-jsonb-generator", version.ref = "avaje-jsonb" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-jul = { module = "org.slf4j:jul-to-slf4j", version.ref = "slf4j" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
undertow-core = { module = "io.undertow:undertow-core", version.ref = "undertow" }
forgery-jodist = { module = "cc.asylum:forgery-jodist", version.ref = "forgery-jodist" }
jimmer-sql = { module = "org.babyfish.jimmer:jimmer-sql", version.ref = "jimmer" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
swagger-core = { module = "io.swagger.core.v3:swagger-core", version.ref = "swagger" }
shadow = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }

[plugins]
foojay = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
