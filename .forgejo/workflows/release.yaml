on:
  push:
    branches:
      - "release/**"

jobs:
  release:
    runs-on: codeberg-small
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - run: ./gradlew --no-daemon build -PreleaseVersion="${GITHUB_REF_NAME#release/}"
      - run: ./gradlew --no-daemon publish -PreleaseVersion="${GITHUB_REF_NAME#release/}"
        env:
          ORG_GRADLE_PROJECT_releasesUsername: ${{ secrets.MAVEN_USER }}
          ORG_GRADLE_PROJECT_releasesPassword: ${{ secrets.MAVEN_TOKEN }}
